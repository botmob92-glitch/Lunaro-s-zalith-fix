name: Build Lunaro Client APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "CPU type (arm64 fits nearly every phone, incl. Galaxy Note10+)"
        required: true
        default: "arm64"
        type: choice
        options: ["arm64", "arm", "all"]

env:
  UPSTREAM_REPO: https://github.com/ZalithLauncher/ZalithLauncher2
  # Exact upstream version the patch was written and checked against (Zalith Launcher 2.7.2)
  UPSTREAM_COMMIT: 3554dff68a974bb39ad15a880a5b0a658cf367e7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Lunaro patch
        uses: actions/checkout@v6

      - name: Check CurseForge key
        env:
          CF_SECRET: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -z "$CF_SECRET" ]; then
            echo "::warning title=CurseForge::The CURSEFORGE_API_KEY secret is empty or missing. The app will build, but CurseForge will say 'no permission'. Modrinth still works without a key."
          else
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "x-api-key: $CF_SECRET" "https://api.curseforge.com/v1/games/432" || true)
            echo "CurseForge key test: HTTP $code (200 = the key works, 403 = CurseForge rejected the key)"
            if [ "$code" != "200" ]; then
              echo "::warning title=CurseForge::Key test returned HTTP $code. Check that you copied the whole key from console.curseforge.com."
            fi
          fi

      - name: Fetch ZalithLauncher2 source (pinned version)
        run: |
          git clone "$UPSTREAM_REPO" upstream
          git -C upstream checkout "$UPSTREAM_COMMIT"
          git -C upstream submodule update --init --recursive

      - name: Generate Lunaro icon
        run: |
          pip install pillow
          python3 patch/make_icons.py

      - name: Apply Lunaro Client branding and theme
        run: python3 patch/apply_lunaro.py upstream

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          add-job-summary: "on-failure"

      # Smooth build first (release-style: code shrinking on, no developer tooling)
      - name: Build APK (smooth)
        id: smooth
        continue-on-error: true
        working-directory: upstream
        env:
          CF_SECRET: ${{ secrets.CURSEFORGE_API_KEY }}
          OAUTH_SECRET: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          # Only pass keys that really exist, an empty value would override the built-in default.
          if [ -n "$CF_SECRET" ]; then export CURSEFORGE_API_KEY="$CF_SECRET"; fi
          if [ -n "$OAUTH_SECRET" ]; then export OAUTH_CLIENT_ID="$OAUTH_SECRET"; fi
          chmod +x gradlew
          ./gradlew ZalithLauncher:assembleLunaro -Darch=${{ inputs.arch }}

      # Safety net: if the smooth build fails for any reason, build the plain debug APK so you still get an app
      - name: Build APK (fallback, slower app)
        if: steps.smooth.outcome == 'failure'
        working-directory: upstream
        env:
          CF_SECRET: ${{ secrets.CURSEFORGE_API_KEY }}
          OAUTH_SECRET: ${{ secrets.OAUTH_CLIENT_ID }}
        run: |
          if [ -n "$CF_SECRET" ]; then export CURSEFORGE_API_KEY="$CF_SECRET"; fi
          if [ -n "$OAUTH_SECRET" ]; then export OAUTH_CLIENT_ID="$OAUTH_SECRET"; fi
          echo "::warning title=Fallback::The smooth build failed, so this APK is the plain debug build and may feel slower."
          ./gradlew ZalithLauncher:assembleDebug -Darch=${{ inputs.arch }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Lunaro-Client-apk-${{ inputs.arch }}
          path: upstream/ZalithLauncher/build/outputs/apk/*/*.apk
